version: '3.8'

services:
  fitfuel-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitfuel-ai-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fitfuel-network

networks:
  fitfuel-network:
    driver: bridge
